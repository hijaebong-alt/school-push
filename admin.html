<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전달사항 관리자</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        textarea { width: 100%; height: 100px; padding: 10px; font-size: 16px; margin-bottom: 10px; box-sizing: border-box; }
        button { padding: 12px 24px; font-size: 16px; background-color: #007BFF; color: white; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; font-weight: bold; }
        .token-box { margin-bottom: 15px; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

    <h2>학교 전달사항 푸시 전송</h2>
    
    <div class="token-box">
        <label>학생 FCM 토큰 (여러 명일 경우 쉼표나 배열로 처리 가능, 테스트용 1개 입력):</label>
        <input type="text" id="targetToken" placeholder="학생 스마트폰에서 발급된 토큰 값을 입력하세요">
    </div>

    <div>
        <label>보낼 메시지 내용:</label>
        <textarea id="messageText" placeholder="전달사항을 입력하세요..."></textarea>
    </div>

    <button onclick="sendPush()">학생에게 푸시 보내기</button>
    <div id="result"></div>

    <script>
        // 💡 주의: FCM HTTP v1 API를 쓰려면 원래 서버 인증이 필요하지만, 
        // 가장 심플하게 테스트하기 위해 레거시 방식 또는 프론트에서 직접 쏘는 구조를 쓸 수 있습니다.
        // (실제 서비스 환경에서는 보안상 서버를 거쳐야 하지만, 20명 소인원 테스트용으로는 아래 함수 구조를 참고하세요.)
        
        async function sendPush() {
            const token = document.getElementById('targetToken').value;
            const text = document.getElementById('messageText').value;
            const resultDiv = document.getElementById('result');

            if (!token || !text) {
                alert('토큰과 메시지를 모두 입력해주세요!');
                return;
            }

            resultDiv.innerText = "전송 중...";

            // Firebase Cloud Messaging 서버 키 (파이어베이스 프로젝트 설정 -> 클라우드 메시징 탭에 있는 '서버 키' 또는 레거시 토큰)
            // *참고: 최신 파이어베이스는 서비스 계정(JSON)을 통한 토큰 인증을 권장하지만, 
            // 가장 단순한 방법으로는 Firebase Cloud Messaging HTTP API v1을 호출하거나 
            // 무료로 배포한 간단한 람다/노드 서버를 거치는 것이 안전합니다.
            
            // 만약 서버를 두기 귀찮다면, 아래처럼 외부 서버less 함수나 간단한 fetch 방식을 쓸 수 있습니다.
            // 혹은 파이어베이스 콘솔(Cloud Messaging 페이지)에 직접 들어가서 수동으로 토큰을 입력하고 쏘셔도 됩니다!
            
            resultDiv.innerText = "파이어베이스 콘솔의 [Cloud Messaging] 메뉴에서 [새 알림]을 눌러 위 토큰을 타겟으로 지정해 보내는 것이 가장 간편합니다.";
        }
    </script>
</body>
</html>
